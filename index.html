<head>

    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1f2c42;
      --text-main: #f9fafb;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --price-tag: #4ade80;
      --wsp-color: #22c55e;
      --wsp-hover: #16a34a;
      --chip-bg: #1e293b;
      --chip-active: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 680px;
    }

    .brand-tag {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Buscador y Controles */
    .controls-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 540px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 44px 13px 20px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-clear {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      display: none;
      padding: 4px;
      line-height: 1;
    }

    /* Filtros por Categoría */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 800px;
    }

    .chip {
      background: var(--chip-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .chip.active {
      background: var(--chip-active);
      color: #ffffff;
      border-color: var(--chip-active);
    }

    .results-count {
      color: var(--text-muted);
      font-size: 0.85rem;
      align-self: flex-start;
      max-width: 1200px;
      width: 100%;
      padding: 0 4px;
      margin-bottom: -10px;
    }

    /* Grilla de Perfumes */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      background-color: #0b0f19;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .perfume-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      transition: transform 0.3s ease;
    }

    .card:hover .perfume-img {
      transform: scale(1.05);
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 9px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
      line-height: 1.3;
    }

    /* Caja destacada de Inspiración Olfativa */
    .inspiration-box {
      background: rgba(56, 189, 248, 0.07);
      border-left: 3px solid var(--accent);
      padding: 6px 10px;
      border-radius: 4px 8px 8px 4px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: #e2e8f0;
      line-height: 1.35;
    }

    .inspiration-label {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.68rem;
      display: block;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .notes {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .notes strong {
      color: #d1d5db;
    }

    /* Selector de Tamaños (5ml / 10ml) */
    .size-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 6px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .size-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
    }

    .size-option:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .size-option.selected {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
    }

    .size-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .size-option.selected .size-label {
      color: var(--accent);
    }

    .size-price {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--price-tag);
    }

    /* Botón WhatsApp */
    .btn-wsp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--wsp-color);
      color: #ffffff;
      text-decoration: none;
      padding: 11px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
    }

    .btn-wsp:hover {
      background-color: var(--wsp-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.3);
    }

    .btn-wsp svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Mensaje sin resultados */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
      display: none;
    }

    .no-results h4 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .no-results p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>

    // ==========================================
    function buildWhatsAppLink(perfumeName, size) {
      const text = encodeURIComponent(`¡Hola! Quiero pedir un decant de ${size} de ${perfumeName}.`);
      return `https://wa.me/${WHATSAPP_PHONE}?text=${text}`;
    }

    function selectSize(perfumeId, size) {
      selectedSizes[perfumeId] = size;
      const card = document.getElementById(`card-${perfumeId}`);
      if (!card) return;

      const options = card.querySelectorAll('.size-option');
      options.forEach(opt => {
        const isSelected = opt.querySelector('.size-label').textContent.includes(size);
        opt.classList.toggle('selected', isSelected);
      });

      const perfume = perfumes.find(p => p.id === perfumeId);
      const wspBtn = document.getElementById(`wsp-${perfumeId}`);
      if (wspBtn && perfume) {
        wspBtn.href = buildWhatsAppLink(perfume.name, size);
      }
    }

    // ==========================================
    // 5. BÚSQUEDA Y FILTRADO
    // ==========================================
    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const clearBtn = document.getElementById('clearBtn');
      clearBtn.style.display = query ? 'block' : 'none';
      applyFilters();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearBtn').style.display = 'none';
      input.focus();
      applyFilters();
    }

    function setCategory(category, element) {
      activeCategory = category;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.grid .card');
      let visibleCount = 0;

      cards.forEach(card => {
        const searchData = card.getAttribute('data-search');
        const cardCategory = card.getAttribute('data-category');

        const matchesQuery = !query || searchData.includes(query);
        const matchesCategory = (activeCategory === 'all') || (cardCategory === activeCategory) || searchData.includes(activeCategory.toLowerCase());

        if (matchesQuery && matchesCategory) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      const noResults = document.getElementById('noResults');
      noResults.style.display = visibleCount === 0 ? 'block' : 'none';

      const countEl = document.getElementById('resultsCount');
      countEl.textContent = `Mostrando ${visibleCount} de ${perfumes.length} fragancias`;
    }

    document.addEventListener('DOMContentLoaded', renderCards);
  </script>

</body>
</html>
